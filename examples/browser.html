<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEIC Converter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    img { max-width: 100%; margin-top: 16px; border-radius: 8px; }
    .drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; }
    .drop-zone.dragover { border-color: #007bff; background: #f0f7ff; }
    select, button { padding: 8px 16px; margin: 8px 4px; font-size: 14px; }
    #status { margin-top: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>HEIC to Any Converter</h1>

  <div class="drop-zone" id="dropZone">
    Drop a .heic file here or click to select
    <input type="file" accept=".heic,.heif" id="fileInput" style="display:none">
  </div>

  <div>
    <label>Output format:</label>
    <select id="format">
      <option value="jpeg">JPEG</option>
      <option value="png">PNG</option>
      <option value="webp">WebP</option>
    </select>
    <label>Quality:</label>
    <select id="quality">
      <option value="0.95">High (95%)</option>
      <option value="0.85" selected>Medium (85%)</option>
      <option value="0.6">Low (60%)</option>
    </select>
  </div>

  <p id="status"></p>
  <img id="preview" style="display:none">
  <a id="download" style="display:none">Download</a>

  <script type="module">
    import { convert, isHeic } from 'heic-anyconv';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const download = document.getElementById('download');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      status.textContent = 'Reading file...';
      const buffer = new Uint8Array(await file.arrayBuffer());

      if (!isHeic(buffer)) {
        status.textContent = 'Not a valid HEIC file.';
        return;
      }

      const format = document.getElementById('format').value;
      const quality = parseFloat(document.getElementById('quality').value);

      status.textContent = 'Converting...';
      const start = performance.now();

      try {
        const result = await convert({ data: buffer, format, quality });
        const elapsed = Math.round(performance.now() - start);

        const blob = new Blob([result.data], { type: result.mimeType });
        const url = URL.createObjectURL(blob);

        preview.src = url;
        preview.style.display = 'block';

        download.href = url;
        download.download = file.name.replace(/\.heic$/i, `.${format === 'jpeg' ? 'jpg' : format}`);
        download.textContent = `Download ${format.toUpperCase()} (${(result.data.length / 1024).toFixed(0)} KB)`;
        download.style.display = 'inline-block';

        status.textContent = `Converted ${result.width}x${result.height} in ${elapsed}ms`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
